version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartscrape_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartscrape_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "python -m app.workers.worker"

  db:
    image: postgres:16-alpine
    container_name: smartscrape_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartscrape_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
