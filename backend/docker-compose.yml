version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: smartscrape
      POSTGRES_USER: smartscrape
      POSTGRES_PASSWORD: smartscrape_pwd
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      - db
      - redis

volumes:
  db_data:
